[package]
name = "koldera-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Command-line client for koldera-core: PDF/UA machine checks and repairs, tagged PDFs from HTML or structured documents, web page scans."
license = "Apache-2.0"
keywords = ["pdf", "accessibility", "pdf-ua", "wcag", "cli"]
categories = ["command-line-utilities", "accessibility"]
exclude = ["/.github", "/scripts"]

[[bin]]
name = "koldera"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
